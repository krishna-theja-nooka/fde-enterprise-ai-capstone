services:
  copilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FLEET_DEMO_MODE: "true"
      FLEET_DB_PATH: /app/runtime/fleet.db
    volumes:
      - fleet-data:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  fleet-data:

