name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m fleet.evaluate --output reports/evaluation.json

      - name: Verify release version
        run: |
          python - <<'PY'
          import os
          from fleet import __version__

          assert os.environ["GITHUB_REF_NAME"] == "v" + __version__, (
              "Tag must match fleet.__version__"
          )
          PY

      - name: Package repository
        run: |
          git archive --format=zip \
            --prefix=fde-enterprise-ai-capstone/ \
            HEAD -o fde-enterprise-ai-capstone.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            fde-enterprise-ai-capstone.zip
            reports/evaluation.json

  publish:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Publish or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Fleet Intelligence Copilot $GITHUB_REF_NAME" \
              --notes-file docs/release-notes.md
          fi

          gh release upload "$GITHUB_REF_NAME" \
            release-files/fde-enterprise-ai-capstone.zip \
            release-files/reports/evaluation.json \
            --clobber
