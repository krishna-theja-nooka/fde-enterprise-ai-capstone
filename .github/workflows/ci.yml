name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-evaluation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m fleet.evaluate --output reports/evaluation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            reports/evaluation.json
            coverage.xml

  container-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t fleet-copilot:ci .

      - name: Start isolated demo container
        run: docker run -d --name fleet-demo -p 127.0.0.1:8000:8000 fleet-copilot:ci

      - name: Check readiness and grounded answer
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8000/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs fleet-demo
            exit 1
          fi
          python - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/copilot/ask",
              data=json.dumps({
                  "question": "Why is V-102 unavailable?"
              }).encode(),
              headers={
                  "Content-Type": "application/json",
                  "X-API-Key": "demo-viewer"
              }
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          assert result["status"] == "answered"
          assert result["citations"]
          PY

      - name: Show container logs
        if: always()
        run: docker logs fleet-demo
