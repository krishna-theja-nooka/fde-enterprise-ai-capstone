[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-enterprise-ai-capstone"
version = "0.1.0"
description = "Fleet Intelligence Copilot: grounded fleet tools with human approvals and audit evidence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.setuptools.package-data]
fleet = ["data/*.json", "data/*.sql", "policies/*.md", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fleet --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]

